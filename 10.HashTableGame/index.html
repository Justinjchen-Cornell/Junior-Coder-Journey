<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>小动物储物柜 🔐</title>
  <link rel="stylesheet" href="css/style.2.0.css">
</head>
<body class="">
<script>if (location.search.includes('fast=1')) document.body.className = 'fast';</script>
  <div id="app">
    <section id="screen-animal" class="screen active">
      <a class="btn-portal-mini" href="../index.html">🎡 回游乐场</a>
      <h1 class="title">🔐 小动物储物柜</h1>
      <p class="subtitle">每件东西都有柜号！查号码表，直接开柜拿！</p>
      <div class="animal-picker" id="animal-picker"></div>
      <div class="mode-picker" id="mode-picker">
        <button class="mode-btn baby" data-mode="baby">🍼 宝宝模式<br><small>5 个柜子 · 找东西</small></button>
        <button class="mode-btn challenge" data-mode="challenge">🚀 挑战模式<br><small>10 个柜子 · 有冲突</small></button>
        <button class="mode-btn team" data-mode="team">🚜 工程队模式<br><small>编号去尾 = 格子号！</small></button>
      </div>
    </section>

    <section id="screen-game" class="screen">
      <header class="game-header">
        <span class="animal-face" id="animal-face">🔐</span>
        <div class="header-info">
          <div class="hint" id="hint">要取的东西：</div>
          <div class="status-line">
            <span class="steps" id="steps"></span>
            <span class="record" id="record"></span>
          </div>
        </div>
      </header>

      <!-- 目标物品 + 号码表 -->
      <div class="target-zone">
        <div class="target-item" id="target-item"></div>
        <div class="hash-table" id="hash-table"></div>
      </div>

      <!-- 柜子墙 -->
      <div class="locker-wall" id="locker-wall"></div>

      <!-- 链柜内容 -->
      <div class="collision-zone" id="collision-zone"></div>

      <div class="feedback" id="feedback"></div>
      <button class="btn-reset" id="btn-reset">🔄 再来一次</button>
      <button class="btn-home" id="btn-home">🏠 换批小动物</button>
    </section>

    <section id="screen-stats" class="screen">
      <div class="reward-card" id="stats-reward" style="display:none"></div>
      <h2 class="stats-title" id="stats-title">全部取到啦！</h2>
      <div class="stats-box" id="stats-box"></div>
      <button class="btn-reset" id="btn-stats-reset">🔄 再取一次</button>
      <button class="btn-home" id="btn-stats-home">🏠 换个模式</button>
      <a class="btn-portal" href="../index.html">🎡 回游乐场</a>
    </section>
  </div>
  <script src="js/game.2.0.js"></script>
  <script src="js/ui.2.0.js"></script>
</body>
</html>
