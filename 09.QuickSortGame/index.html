<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>书架整理员 📚</title>
  <link rel="stylesheet" href="css/style.1.0.css">
</head>
<body class="">
<script>
  // fast 模式（测试用）：禁用动画，避免点击稳定性干扰
  if (location.search.includes('fast=1')) document.body.className = 'fast';
</script>
  <div id="app">
    <section id="screen-animal" class="screen active">
      <h1 class="title">📚 书架整理员</h1>
      <p class="subtitle">小动物的书乱糟糟的！抽一本「标杆」，把书分成两堆吧！</p>
      <div class="animal-picker" id="animal-picker"></div>
      <div class="mode-picker" id="mode-picker">
        <button class="mode-btn baby" data-mode="baby">🍼 宝宝模式<br><small>5~7 本 · 分堆玩</small></button>
        <button class="mode-btn challenge" data-mode="challenge">🚀 挑战模式<br><small>8~12 本 · 比回合</small></button>
      </div>
    </section>
    <section id="screen-game" class="screen">
      <header class="game-header">
        <span class="animal-face" id="animal-face">📚</span>
        <div class="header-info">
          <div class="hint" id="hint">抽一本当标杆！随便选哪本都行～</div>
          <div class="status-line">
            <span class="steps" id="steps"></span>
            <span class="rounds" id="rounds"></span>
            <span class="record" id="record"></span>
          </div>
        </div>
      </header>

      <div class="shelf-zone">
        <div class="shelf-label">📖 书架</div>
        <div class="shelf" id="shelf"></div>
      </div>

      <div class="pivot-zone" id="pivot-zone"></div>
      <div class="pending-zone" id="pending-zone"></div>
      <div class="classify-zone" id="classify-zone"></div>

      <div class="feedback" id="feedback"></div>
      <button class="btn-reset" id="btn-reset">🔄 再来一次</button>
      <button class="btn-home" id="btn-home">🏠 换批小动物</button>
    </section>

    <section id="screen-stats" class="screen">
      <h2 class="stats-title" id="stats-title">书架排好啦！</h2>
      <div class="stats-box" id="stats-box"></div>
      <button class="btn-reset" id="btn-stats-reset">🔄 再排一次</button>
      <button class="btn-home" id="btn-stats-home">🏠 换个模式</button>
    </section>
  </div>
  <script src="js/game.1.0.js"></script>
  <script src="js/ui.1.0.js"></script>
</body>
</html>
