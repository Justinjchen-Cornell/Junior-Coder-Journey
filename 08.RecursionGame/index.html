<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>套娃拆拆乐 🪆</title>
  <link rel="stylesheet" href="css/style.2.1.css">
</head>
<body>
  <div id="app">
    <!-- 开场 -->
    <section id="screen-animal" class="screen active">
      <a class="btn-portal-mini" href="../index.html">🎡 回游乐场</a>
      <h1 class="title">🪆 套娃拆拆乐</h1>
      <p class="subtitle">小松鼠的套娃，一层一层拆开，再数回来！</p>
      <div class="animal-picker" id="animal-picker"></div>
      <div class="mode-picker" id="mode-picker">
        <button class="mode-btn baby" data-mode="baby">🍼 宝宝模式<br><small>5~7 层 · 拆开数回来</small></button>
        <button class="mode-btn challenge" data-mode="challenge">🚀 挑战模式<br><small>8~10 层 · 记住数字往回点</small></button>
      </div>
    </section>

    <!-- 游戏主界面 -->
    <section id="screen-game" class="screen">
      <header class="game-header">
        <span class="animal-face" id="animal-face">🐿️</span>
        <div class="header-info">
          <div class="hint" id="hint">点「打开」，看看里面是什么</div>
          <div class="status-line">
            <span class="steps" id="steps"></span>
            <span class="record" id="record"></span>
          </div>
        </div>
      </header>

      <!-- 套娃展示区 -->
      <div class="nest-zone" id="nest-zone">
        <div class="doll big" id="doll-outer">🪆</div>
      </div>

      <!-- 操作区 -->
      <div class="action-zone" id="action-zone">
        <button class="btn-open" id="btn-open">打开！</button>
      </div>

      <!-- 回溯区（挑战模式数字按键） -->
      <div class="backtrack-zone" id="backtrack-zone"></div>

      <div class="feedback" id="feedback"></div>
      <button class="btn-reset" id="btn-reset">🔄 再来一次</button>
      <button class="btn-home" id="btn-home">🏠 换只小动物</button>
    </section>

    <!-- 结算 -->
    <section id="screen-stats" class="screen">
      <div class="reward-card" id="stats-reward" style="display:none"></div>
      <h2 class="stats-title" id="stats-title">拆完啦！</h2>
      <div class="stats-box" id="stats-box"></div>
      <button class="btn-reset" id="btn-stats-reset">🔄 再拆一摞</button>
      <button class="btn-home" id="btn-stats-home">🏠 换个模式</button>
      <a class="btn-portal" href="../index.html">🎡 回游乐场</a>
    </section>
  </div>
  <script src="js/game.2.1.js"></script>
  <script src="js/ui.2.1.js"></script>
</body>
</html>
